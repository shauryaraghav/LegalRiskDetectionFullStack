[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "data", "models"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741", "E702"]

[tool.ruff.lint.per-file-ignores]
"src/io_utils.py" = ["E402"]
"server_tests/conftest.py" = ["E402"]

[tool.coverage.run]
source = ["server", "src"]
omit = ["src/cuad_import.py", "src/merge_dataset.py"]
