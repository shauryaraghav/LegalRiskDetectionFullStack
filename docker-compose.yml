services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: legalrisk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrisk"]
      interval: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://legalrisk:${POSTGRES_PASSWORD}@db:5432/legalrisk
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: http://localhost:8080
    depends_on: { db: { condition: service_healthy } }
    volumes:                 # keep retrained models and approved corrections across restarts
      - models:/app/models
      - data:/app/data

  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]

volumes: { pgdata: {}, models: {}, data: {} }
