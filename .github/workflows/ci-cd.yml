name: CI/CD

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-server.txt }
      - run: pip install -r requirements-server.txt ruff pytest-cov
      - run: ruff check .
      - run: python -m pytest tests server_tests -q --cov --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: ., file: Dockerfile.backend }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build (cached)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan for critical vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE:ci"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push (sha + latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    # Enable by setting the repo variable DEPLOY_ENABLED=true (plus DOMAIN) and secrets EC2_HOST, EC2_SSH_KEY.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: read }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Upload compose + config
        run: |
          scp -i ~/.ssh/deploy docker-compose.prod.yml "ec2-user@$HOST:/opt/legalrisk/docker-compose.yml"
          scp -i ~/.ssh/deploy -r deploy "ec2-user@$HOST:/opt/legalrisk/"
      - name: Deploy (health-checked, auto-rollback)
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "ec2-user@$HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin && chmod +x /opt/legalrisk/deploy/scripts/*.sh && /opt/legalrisk/deploy/scripts/deploy.sh ${{ github.sha }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "https://${{ vars.DOMAIN }}/api/health" | grep -q '"status":"ok"' && exit 0
            sleep 6
          done
          echo "health check failed" && exit 1
